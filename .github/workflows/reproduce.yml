name: Offline reproduction

on:
  push:
  pull_request:

jobs:
  analytical-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scripts experiments experiments_x
      - run: python scripts/reproduce.py --outdir runs/analytical
